{% extends "base.html" %}
{% block title %}Analyzing… — Finance Analyzer{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto text-center py-16">

  <!-- Spinner -->
  <div class="flex justify-center mb-8">
    <div class="relative w-24 h-24">
      <svg class="animate-spin w-24 h-24 text-emerald-500/20" fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
      </svg>
      <svg class="animate-spin w-24 h-24 text-emerald-500 absolute inset-0" style="animation-duration:1.2s"
           fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-width="2" stroke-linecap="round"
          d="M12 2a10 10 0 0110 10"/>
      </svg>
      <div class="absolute inset-0 flex items-center justify-center">
        <svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
      </div>
    </div>
  </div>

  <h1 class="text-2xl font-bold text-white mb-2">Analyzing Your Finances</h1>
  <p class="text-slate-400 mb-10">
    Claude AI is reading your statements and building your plan.<br>
    This typically takes 1–3 minutes.
  </p>

  <!-- Progress steps -->
  <div class="card p-6 text-left mb-6">
    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Progress</h2>
    <ul id="stepsList" class="space-y-2.5">
      <!-- steps injected by JS -->
    </ul>
  </div>

  <!-- Error box (hidden by default) -->
  <div id="errorBox" class="hidden card border-red-500/30 bg-red-500/5 p-5 text-left">
    <p class="text-red-400 font-semibold mb-1">Analysis failed</p>
    <p id="errorMsg" class="text-red-300 text-sm"></p>
    <a href="/" class="inline-block mt-3 text-sm text-red-400 underline">← Try again</a>
  </div>

</div>

<script>
const RUN_ID = "{{ run_id }}";
let lastStepCount = 0;

function renderStep(text, i) {
  const li = document.createElement('li');
  li.className = 'flex items-start gap-2.5 text-sm';
  li.innerHTML = `
    <svg class="w-4 h-4 text-emerald-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span class="text-slate-300">${text}</span>
  `;
  return li;
}

async function poll() {
  try {
    const res = await fetch(`/api/status/${RUN_ID}`);
    if (!res.ok) { setTimeout(poll, 2000); return; }
    const data = await res.json();

    // Append any new steps
    const list = document.getElementById('stepsList');
    if (data.steps && data.steps.length > lastStepCount) {
      for (let i = lastStepCount; i < data.steps.length; i++) {
        list.appendChild(renderStep(data.steps[i], i));
      }
      lastStepCount = data.steps.length;
    }

    if (data.status === 'done') {
      window.location.href = `/dashboard/${RUN_ID}`;
    } else if (data.status === 'error') {
      document.getElementById('errorBox').classList.remove('hidden');
      document.getElementById('errorMsg').textContent = data.error || 'An unknown error occurred.';
    } else {
      setTimeout(poll, 2000);
    }
  } catch (e) {
    setTimeout(poll, 3000);
  }
}

poll();
</script>
{% endblock %}
