[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-product-agents"
version = "0.1.0"
description = "AI agent pipeline that researches, creates, designs, lists, and markets beautiful digital products"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer[all]>=0.12.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
dp = "main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
